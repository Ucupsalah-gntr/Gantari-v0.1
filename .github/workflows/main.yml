name: Test Gantariku

on:
push:
branches:
- main

pull_request:
branches:
- main

permissions:
contents: read

jobs:
test:
name: Test & Validate Gantariku
runs-on: ubuntu-latest

```
steps:
  # ==========================================================
  # 1. Checkout source code
  # ==========================================================
  - name: Checkout repository
    uses: actions/checkout@v5

  # ==========================================================
  # 2. Setup Node.js
  # ==========================================================
  - name: Setup Node.js
    uses: actions/setup-node@v5
    with:
      node-version: 22
      cache: npm

  # ==========================================================
  # 3. Check project structure
  # ==========================================================
  - name: Check project structure
    shell: bash
    run: |
      set -e

      echo "======================================"
      echo "   CHECK PROJECT STRUCTURE"
      echo "======================================"

      required_paths=(
        "index.html"
        "css"
        "js"
      )

      for path in "${required_paths[@]}"; do
        if [ ! -e "$path" ]; then
          echo "❌ Tidak ditemukan: $path"
          exit 1
        fi

        echo "✅ Ditemukan: $path"
      done

      echo ""
      echo "Struktur utama project OK."

  # ==========================================================
  # 4. Tampilkan file JavaScript
  # ==========================================================
  - name: List JavaScript files
    shell: bash
    run: |
      echo "======================================"
      echo "   JAVASCRIPT FILES"
      echo "======================================"

      if [ -d "js" ]; then
        find js -type f -name "*.js" | sort
      else
        echo "Folder js/ tidak ditemukan."
        exit 1
      fi

  # ==========================================================
  # 5. Install dependencies
  # ==========================================================
  - name: Install dependencies with npm ci
    if: ${{ hashFiles('package-lock.json') != '' }}
    run: npm ci

  - name: Install dependencies with npm install
    if: ${{ hashFiles('package-lock.json') == '' && hashFiles('package.json') != '' }}
    run: npm install

  # ==========================================================
  # 6. Run npm test jika package.json tersedia
  # ==========================================================
  - name: Run npm test
    if: ${{ hashFiles('package.json') != '' }}
    run: npm test

  # ==========================================================
  # 7. Check JavaScript syntax
  # ==========================================================
  - name: Check JavaScript syntax
    shell: bash
    run: |
      set -e

      echo "======================================"
      echo "   JAVASCRIPT SYNTAX CHECK"
      echo "======================================"

      files=$(find js -type f -name "*.js" | sort)

      if [ -z "$files" ]; then
        echo "Tidak ada file JavaScript."
        exit 0
      fi

      for file in $files; do
        echo "Checking: $file"
        node --check "$file"
      done

      echo ""
      echo "✅ Semua file JavaScript lolos syntax check."

  # ==========================================================
  # 8. Validate index.html
  # ==========================================================
  - name: Validate index.html
    shell: bash
    run: |
      set -e

      echo "======================================"
      echo "   HTML CHECK"
      echo "======================================"

      if [ ! -f "index.html" ]; then
        echo "❌ index.html tidak ditemukan."
        exit 1
      fi

      if [ ! -s "index.html" ]; then
        echo "❌ index.html kosong."
        exit 1
      fi

      echo "✅ index.html tersedia dan tidak kosong."

  # ==========================================================
  # 9. Final summary
  # ==========================================================
  - name: Test summary
    run: |
      echo ""
      echo "======================================"
      echo "      GANTARIKU TEST PASSED"
      echo "======================================"
      echo ""
      echo "✅ Repository berhasil di-check"
      echo "✅ Node.js 22 tersedia"
      echo "✅ JavaScript syntax OK"
      echo "✅ index.html OK"
      echo "✅ Struktur project OK"
      echo "✅ npm test dijalankan jika package.json tersedia"
      echo ""
      echo "======================================"
      echo "       SIAP UNTUK DEPLOYMENT"
      echo "======================================"
