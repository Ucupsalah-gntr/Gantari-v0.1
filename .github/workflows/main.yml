name: Test Gantariku

on:
push:
branches:
- main
pull_request:
branches:
- main

permissions:
contents: read

jobs:
test:
name: Test and Validate Gantariku
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v5

  - name: Setup Node.js
    uses: actions/setup-node@v5
    with:
      node-version: 22

  - name: Check required files
    run: |
      test -f index.html
      test -d css
      test -d js
      echo "Required files and folders are OK."

  - name: Check JavaScript syntax
    run: |
      find js -type f -name "*.js" -print0 | while IFS= read -r -d '' file
      do
        echo "Checking $file"
        node --check "$file"
      done

  - name: Check index.html
    run: |
      test -s index.html
      echo "index.html is OK."

  - name: Run npm test if package.json exists
    if: ${{ hashFiles('package.json') != '' }}
    run: |
      npm install
      npm test

  - name: Finish
    run: |
      echo "================================"
      echo "GANTARIKU TEST PASSED"
      echo "================================"
```
