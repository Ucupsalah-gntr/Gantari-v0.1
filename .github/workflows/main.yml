name: Test Gantariku

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Test Gantariku
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check files
        run: |
          test -f index.html
          test -d css
          test -d js
          echo "Project structure OK"

      - name: Check JavaScript
        run: |
          find js -type f -name "*.js" -print0 | while IFS= read -r -d '' file
          do
            echo "Checking: $file"
            node --check "$file"
          done

      - name: Check HTML
        run: |
          test -s index.html
          echo "index.html OK"

      - name: Sync package lock
        if: github.event_name == 'pull_request'
        run: |
          npm install --package-lock-only
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already in sync"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync package lock for audit"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Success
        run: echo "GANTARIKU TEST PASSED"
