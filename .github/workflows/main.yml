name: Test Gantariku

"on":
push:
branches:
- main
pull_request:
branches:
- main

permissions:
contents: read

jobs:
test:
name: Test Gantariku
runs-on: ubuntu-latest
steps:
  - name: Checkout
    uses: actions/checkout@v5

  - name: Setup Node
    uses: actions/setup-node@v5
    with:
      node-version: 22

  - name: Check files
    run: |
      test -f index.html
      test -d css
      test -d js
      echo "Project structure OK"

  - name: Check JavaScript
    run: |
      find js -type f -name "*.js" -print0 | while IFS= read -r -d '' file
      do
        echo "Checking: $file"
        node --check "$file"
      done

  - name: Check HTML
    run: |
      test -s index.html
      echo "index.html OK"

  - name: Run tests
    if: ${{ hashFiles('package.json') != '' }}
    run: |
      npm install
      npm test

  - name: Success
    run: echo "GANTARIKU TEST PASSED"
