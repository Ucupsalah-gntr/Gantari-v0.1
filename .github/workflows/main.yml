name: Test Gantariku

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test Gantariku
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check files
        run: |
          test -f index.html
          test -d css
          test -d js
          echo "Project structure OK"

      - name: Check JavaScript
        run: |
          find js -type f -name "*.js" -print0 | while IFS= read -r -d '' file
          do
            echo "Checking: $file"
            node --check "$file"
          done

      - name: Check HTML
        run: |
          test -s index.html
          echo "index.html OK"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Success
        run: echo "GANTARIKU TEST PASSED"
