<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Anak menari dengan nuansa Gambang Semarang">
<defs>
 <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#FFF7D6"/><stop offset=".55" stop-color="#E9F6EE"/><stop offset="1" stop-color="#DCEFFF"/></linearGradient>
 <linearGradient id="dress" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFD12F"/><stop offset=".5" stop-color="#F3B72E"/><stop offset="1" stop-color="#E88C45"/></linearGradient>
 <linearGradient id="shawl" x1="0" x2="1"><stop stop-color="#E85C5C"/><stop offset="1" stop-color="#C73D52"/></linearGradient>
 <linearGradient id="batik" x1="0" x2="1"><stop stop-color="#355D78"/><stop offset="1" stop-color="#6B4A39"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="760" rx="42" fill="url(#bg)"/>
<g opacity=".32" fill="#FFD12F">
 <circle cx="1000" cy="130" r="74"/><circle cx="1080" cy="300" r="35"/><circle cx="870" cy="600" r="42"/>
</g>
